<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Itzpapa Final</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

    <div class="personaje">
        <!-- Aura brillante de fondo -->
        <div class="aura"></div>

        <!-- Gancho superior (atrás de la cabeza) -->
        <div class="gancho"></div>

        <!-- Cuerpo principal (Aplica el contorno negro grueso a todo) -->
        <div class="cuerpo-contorno">
            
            <!-- Aletas superiores (patitas arriba de la cabeza) -->
            <div class="aleta-superior trasera"></div>
            <div class="aleta-superior delantera"></div>

            <!-- Máscara que le da la silueta exacta al tiburón -->
            <div class="cuerpo-silueta">
                
                <!-- Branquias -->
                <div class="branquias">
                    <div class="raya"></div>
                    <div class="raya"></div>
                    <div class="raya"></div>
                </div>

                <!-- Triángulos derechos -->
                <div class="triangulos">
                    <div class="triangulo rosa"></div>
                    <div class="triangulo azul"></div>
                    <div class="triangulo rosa"></div>
                </div>

                <!-- Vientre blanco sobrepuesto -->
                <div class="vientre-blanco">
                    <!-- Borde azul claro detrás de los dientes -->
                    <div class="dientes-borde"></div>
                    <!-- Dientes blancos -->
                    <div class="dientes"></div>
                    
                    <!-- Patrón inferior (zigzag azul) -->
                    <div class="patron-abajo-borde"></div>
                    <div class="patron-abajo"></div>

                    <!-- Costura vertical -->
                    <div class="costura"></div>
                </div>

            </div>
        </div>

        <!-- Ojo -->
        <div class="ojo">
            <div class="pupila"></div>
        </div>

        <!-- Lengua colgando -->
        <div class="lengua-contorno">
            <div class="lengua">
                <div class="linea-cruzada"></div>
                <div class="linea-cruzada inversa"></div>
            </div>
        </div>

        <!-- Aleta/Brazo derecho -->
        <div class="aleta">
            <div class="costura-aleta"></div>
        </div>
        
        <!-- Destellos -->
        <div class="destello d1"></div>
        <div class="destello d2"></div>
    </div>

</body>
</html>
